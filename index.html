<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FEE500" />
<title>스낵앤가든 크루 보이스 접수</title>
<style>
  :root{
    --kakao:#FEE500;
    --ink:#191919;
    --gray1:#555;
    --gray2:#888;
    --gray3:#bbb;
    --line:#ececec;
    --bg:#f6f6f4;
    --card:#ffffff;
    --ok:#12b886;
    --radius:18px;
    --shadow:0 6px 24px rgba(25,25,25,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",system-ui,-apple-system,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:460px;margin:0 auto;min-height:100vh;
    background:var(--bg);
    display:flex;flex-direction:column;
  }

  /* ── Header ── */
  header{
    position:sticky;top:0;z-index:5;
    background:var(--kakao);
    padding:calc(env(safe-area-inset-top) + 18px) 22px 20px;
    border-bottom-left-radius:22px;border-bottom-right-radius:22px;
  }
  .brand{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink);letter-spacing:.02em}
  .brand .dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
  .brand .sep{color:rgba(25,25,25,.4);font-weight:600}
  h1{margin:14px 0 4px;font-size:23px;font-weight:800;letter-spacing:-.02em}
  .sub{font-size:13px;color:rgba(25,25,25,.62);font-weight:600}

  /* ── Body ── */
  main{flex:1;padding:22px 18px 30px}
  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:20px 18px;margin-bottom:14px;
    animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
  }
  .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.1s}
  .card:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .label{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px}
  .label .num{
    width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;
    font-size:11px;display:grid;place-items:center;font-weight:800
  }
  .req{color:#ff5b5b;font-size:12px}

  .chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chip{
    border:1.5px solid var(--line);background:#fafafa;border-radius:13px;
    padding:13px 12px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:9px;
    font-size:14px;font-weight:700;color:var(--gray1);user-select:none
  }
  .chip .ico{font-size:18px;line-height:1}
  .chip:active{transform:scale(.97)}
  .chip.on{border-color:var(--ink);background:var(--kakao);color:var(--ink);box-shadow:0 3px 10px rgba(254,229,0,.4)}

  input[type=text],textarea{
    width:100%;border:1.5px solid var(--line);border-radius:13px;
    padding:13px 14px;font:inherit;font-size:15px;color:var(--ink);background:#fafafa;
    transition:.18s;resize:none
  }
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ink);background:#fff}
  textarea{min-height:104px;line-height:1.55}
  .hint{font-size:12px;color:var(--gray2);margin-top:8px}
  .count{float:right;font-variant-numeric:tabular-nums}

  .loc-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .loc-quick span{
    font-size:12.5px;font-weight:700;color:var(--gray1);background:#f1f1ef;
    padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s
  }
  .loc-quick span:active{transform:scale(.95)}
  .loc-quick span.on{background:var(--ink);color:#fff}

  /* ── Submit ── */
  .submit{
    width:100%;border:none;border-radius:15px;background:var(--ink);color:#fff;
    font:inherit;font-size:16px;font-weight:800;padding:17px;cursor:pointer;
    transition:.18s;margin-top:4px;letter-spacing:-.01em
  }
  .submit:active{transform:scale(.98)}
  .submit:disabled{background:#d8d8d6;color:#fff;cursor:not-allowed}
  .foot{text-align:center;font-size:11.5px;color:var(--gray3);margin-top:18px;font-weight:600}

  /* ── Success ── */
  .done{
    position:fixed;inset:0;z-index:20;background:var(--bg);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:30px;text-align:center;
  }
  .done.show{display:flex;animation:fade .35s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .check{
    width:96px;height:96px;border-radius:50%;background:var(--kakao);
    display:grid;place-items:center;margin-bottom:22px;
    animation:pop .5s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
  .check svg{width:46px;height:46px}
  .check path{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none;
    stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s .25s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .done h2{font-size:24px;font-weight:800;margin:0 0 8px}
  .done p{font-size:14px;color:var(--gray1);margin:0 0 24px;font-weight:600}
  .ticket{
    background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    padding:18px 22px;width:100%;max-width:320px;text-align:left;margin-bottom:26px
  }
  .ticket .row{display:flex;justify-content:space-between;padding:9px 0;font-size:13.5px}
  .ticket .row + .row{border-top:1px dashed var(--line)}
  .ticket .k{color:var(--gray2);font-weight:700}
  .ticket .v{color:var(--ink);font-weight:800}
  .badge{display:inline-flex;align-items:center;gap:5px;background:#eafaf3;color:var(--ok);
    font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px}
  .badge .pulse{width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .again{border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:12px 26px;
    font:inherit;font-size:14px;font-weight:800;color:var(--ink);cursor:pointer}
  .flow{margin-top:24px;font-size:12px;color:var(--gray2);font-weight:700;line-height:1.9}
  .flow b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot"></span>링키지랩<span class="sep">×</span>카카오페이
    </div>
    <h1>크루 보이스 접수</h1>
    <div class="sub">불편·요청을 남기면 총무 담당자와 <b>동시에</b> 확인해 즉각 대응합니다</div>
  </header>

  <main>
    <form id="f">
      <div class="card">
        <div class="label"><span class="num">1</span>어떤 내용인가요? <span class="req">*</span></div>
        <div class="chips" id="chips">
          <div class="chip" data-v="품절/재고"><span class="ico">📦</span>품절 · 재고</div>
          <div class="chip" data-v="위생"><span class="ico">🧼</span>위생 · 청결</div>
          <div class="chip" data-v="신상품 요청"><span class="ico">🍫</span>신상품 요청</div>
          <div class="chip" data-v="기타"><span class="ico">💬</span>기타 의견</div>
        </div>
      </div>

      <div class="card">
        <div class="label"><span class="num">2</span>위치 <span class="req">*</span></div>
        <input type="text" id="loc" placeholder="예) 9층 스낵 코너" autocomplete="off" />
        <div class="loc-quick" id="locq">
          <span>9층</span><span>10층</span><span>11층</span><span>12층</span><span>공용 라운지</span>
        </div>
      </div>

      <div class="card">
        <div class="label"><span class="num">3</span>내용 <span class="req">*</span></div>
        <textarea id="msg" maxlength="300" placeholder="예) 바나나 우유 재고가 소진됐어요. 보충 부탁드립니다!"></textarea>
        <div class="hint">사진은 접수 후 카카오톡으로 이어서 보낼 수 있어요<span class="count"><b id="c">0</b>/300</span></div>
      </div>

      <button class="submit" id="btn" type="submit" disabled>보이스 접수하기</button>
      <div class="foot">Linkagelab Snack&amp;Garden · 실시간 대응 시스템 데모</div>
    </form>
  </main>
</div>

<!-- Success -->
<div class="done" id="done">
  <div class="check">
    <svg viewBox="0 0 60 60"><path d="M16 31 L26 41 L45 20"/></svg>
  </div>
  <h2>접수 완료!</h2>
  <p>총무 담당자에게 실시간으로 전달됐어요</p>
  <div class="ticket">
    <div class="row"><span class="k">접수번호</span><span class="v" id="tno">—</span></div>
    <div class="row"><span class="k">분류</span><span class="v" id="tcat">—</span></div>
    <div class="row"><span class="k">위치</span><span class="v" id="tloc">—</span></div>
    <div class="row"><span class="k">접수시각</span><span class="v" id="ttime">—</span></div>
    <div class="row"><span class="k">상태</span><span class="v"><span class="badge"><span class="pulse"></span>담당자 확인중</span></span></div>
  </div>
  <button class="again" onclick="location.reload()">새 보이스 접수</button>
  <div class="flow">QR 접수 → <b>총무 동시 확인</b> → 현장 즉각 조치</div>
</div>

<script>
  var cat="";
  var chips=document.getElementById('chips');
  chips.addEventListener('click',function(e){
    var el=e.target.closest('.chip'); if(!el)return;
    [].forEach.call(chips.children,function(c){c.classList.remove('on')});
    el.classList.add('on'); cat=el.dataset.v; check();
  });
  var loc=document.getElementById('loc'), locq=document.getElementById('locq');
  locq.addEventListener('click',function(e){
    if(e.target.tagName!=='SPAN')return;
    [].forEach.call(locq.children,function(s){s.classList.remove('on')});
    e.target.classList.add('on'); loc.value=e.target.textContent; check();
  });
  var msg=document.getElementById('msg'), c=document.getElementById('c');
  msg.addEventListener('input',function(){c.textContent=msg.value.length;check()});
  loc.addEventListener('input',check);
  var btn=document.getElementById('btn');
  function check(){
    btn.disabled=!(cat && loc.value.trim() && msg.value.trim());
  }
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault();
    var now=new Date();
    var pad=function(n){return(n<10?'0':'')+n};
    var no='SG-'+pad(now.getMonth()+1)+pad(now.getDate())+'-'+String(Math.floor(Math.random()*900)+100);
    document.getElementById('tno').textContent=no;
    document.getElementById('tcat').textContent=cat;
    document.getElementById('tloc').textContent=loc.value.trim();
    document.getElementById('ttime').textContent=pad(now.getHours())+':'+pad(now.getMinutes());
    document.getElementById('done').classList.add('show');
    window.scrollTo(0,0);
  });
</script>
</body>
</html>
